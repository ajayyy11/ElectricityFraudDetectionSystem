{% extends "layout.html" %}

{% block content %}

<h2 class="mb-4">Risk Analysis</h2>

<div class="card p-4">
    <h5>Fraud Probability</h5>
    <h2 class="text-danger">{{ fraud }}%</h2>

    {% if fraud > 25 %}
        <p class="text-danger">High risk behavior detected.</p>
    {% elif fraud > 15 %}
        <p class="text-warning">Moderate anomaly observed.</p>
    {% else %}
        <p class="text-success">Low risk profile.</p>
    {% endif %}
</div>

{% endblock %}
