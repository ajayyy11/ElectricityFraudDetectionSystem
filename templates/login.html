{% extends "base.html" %}
{% block content %}

<div style="display:flex; justify-content:center; align-items:center; height:70vh;">
    <div class="card" style="width:400px;">
        <h2>Welcome Back</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px;">
            <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin-bottom:20px; border-radius:8px;">
            <button class="btn-primary" type="submit">Login</button>
        </form>
        <p style="margin-top:15px;">
            Don’t have account? <a href="/register">   Register</a>
        </p>
    </div>
</div>

{% endblock %}
