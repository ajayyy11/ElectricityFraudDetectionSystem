<style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4950cf, #6f74da);
            min-height: 100vh;
        }

        nav {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav h2 {
            margin: 0;
            font-weight: 600;
        }

        nav div a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 500;
        }

        nav div a:hover {
            opacity: 0.8;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .stat-box {
            background: rgba(255,255,255,0.25);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .stat-box:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.05);
        }

        .stat-box h2 {
            margin: 0;
            font-size: 28px;
        }

        .btn-primary {
            background: white;
            color: #4e54c8;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-primary:hover {
            background: #eaeaea;
            transform: scale(1.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        th {
            background: rgba(255,255,255,0.3);
            padding: 12px;
        }

        td {
            padding: 10px;
            background: rgba(255,255,255,0.15);
        }

        tr:hover td {
            background: rgba(255,255,255,0.25);
        }

        .alert-high {
            background: rgba(255,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
<div style="display:flex; justify-content:center; align-items:center; height:70vh;">
    <div class="card" style="width:400px;">
        <h2>Welcome To EFD</h2>
        <h2>Register</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px;"><br>
            <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px;"><br>
            <button type="submit" class="btn-primary">Register</button>
            <a href="/login" class="btn btn-primary">Go Back</a>

        </form>
    </div>
</div>
<a href="/login">Login</a>
