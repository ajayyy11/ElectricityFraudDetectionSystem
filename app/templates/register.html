{% extends "base.html" %}
{% block title %}Create Account — EFD Platform{% endblock %}

{% block content %}
<div class="auth-header" style="text-align: center; margin-bottom: 40px;">
    <h2 style="color:#fff; font-weight:800; font-size: 28px; margin-bottom:8px; letter-spacing: -0.5px;">Join the Network</h2>
    <p style="color:var(--text-muted); font-size:14px;">Deploy your energy security credentials</p>
</div>

<form method="POST" id="registerForm">
    <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a unique identifier" required minlength="3" autocomplete="username">
    </div>
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="your@nexus.com" required autocomplete="email">
    </div>
    <div class="form-group">
        <label>Access Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
    </div>
    <div class="form-group" style="margin-bottom: 32px;">
        <label>Confirm Password</label>
        <input type="password" id="confirm" name="confirm" class="form-control" placeholder="Verify your password" required autocomplete="new-password">
        <div id="pwMatch" style="font-size:11px; margin-top:8px; display:none;"></div>
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; justify-content: center; padding: 16px;">
        Initialize Account <i class="bi bi-shield-lock-fill"></i>
    </button>
</form>

<div class="auth-footer text-center" style="text-align: center;">
    <p>Already a member? <a href="{{ url_for('auth.login') }}">Secure Log In</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
    const pw = document.getElementById('password');
    const cf = document.getElementById('confirm');
    const msg = document.getElementById('pwMatch');
    const btn = document.getElementById('submitBtn');

    function checkMatch() {
        if (!cf.value) { msg.style.display = 'none'; return; }
        msg.style.display = 'block';
        if (pw.value !== cf.value) {
            msg.innerHTML = '<span style="color:#ef4444;"><i class="bi bi-x-circle"></i> Passwords do not match</span>';
            btn.style.opacity = '0.5';
            btn.disabled = true;
        } else {
            msg.innerHTML = '<span style="color:#10b981;"><i class="bi bi-check-circle"></i> Passwords match</span>';
            btn.style.opacity = '1';
            btn.disabled = false;
        }
    }
    cf.addEventListener('input', checkMatch);
    pw.addEventListener('input', checkMatch);
</script>
{% endblock %}
