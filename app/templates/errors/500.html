{% extends "base.html" %}
{% block title %}500 - System Error{% endblock %}
{% block content %}
<div style="text-align:center; padding:64px 24px;">
    <div style="font-size:120px; font-weight:900; color:rgba(239,68,68,0.1); line-height:1;">500</div>
    <div style="margin-top:-60px;">
        <h1 style="font-size:32px; font-weight:800; color:var(--text-bold); margin-bottom:16px;">System Anomaly</h1>
        <p style="color:var(--text-muted); max-width:400px; margin:0 auto 32px;">Our AI engine encountered an unexpected error. The security team has been notified. Please try again later.</p>
        <a href="{{ url_for('dashboard.main_dashboard') }}" class="btn btn-secondary" style="padding:12px 32px;">Back to Safety</a>
    </div>
</div>
{% endblock %}
